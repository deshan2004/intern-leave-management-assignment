# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=leave-management

# Default Database Configuration: H2 In-Memory (Zero setup needed to run immediately)
spring.datasource.url=jdbc:h2:mem:leavedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson / JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

